<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartDrop — Something is waiting inside your heart</title>
  <meta name="description" content="HeartDrop is an AR-style digital surprise where gestures unlock heartfelt messages from loved ones.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      HeartDrop
    </a>
    <div class="nav-links">
      <a href="/create" class="nav-link">Create</a>
    </div>
  </nav>

  {% if error %}
  <div class="flash-container">
    <div class="flash-message">
      <span>{{ error }}</span>
    </div>
  </div>
  {% endif %}

  <main class="container">
    <section class="hero">
      <div class="hero-symbol">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h1 class="hero-title">Something is waiting inside your heart.</h1>
      <p class="hero-subtitle">
        An intimate digital surprise. Send a secret photo and message that only unlocks when they bring both hands to their heart.
      </p>
      <a href="/create" class="btn btn-primary" id="btn-create-heart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        Create a Heart
      </a>
    </section>
  </main>
</body>
</html>
