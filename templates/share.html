<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Heart Is Ready — HeartDrop</title>
  <meta name="description" content="Share this private link with your receiver.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      HeartDrop
    </a>
    <div class="nav-links">
      <a href="/create" class="nav-link">Create Another</a>
    </div>
  </nav>

  <main class="container">
    <div class="card" style="text-align: center;">
      <div class="hero-symbol" style="margin-bottom: 1.2rem;">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>

      <h1 class="card-title">Your Heart Is Ready</h1>
      <p class="card-subtitle">
        Share this secret link. When they place both hands on their chest, your memory will beat to life.
      </p>

      <div class="share-link-box">
        <span class="share-link-text" id="share-link">{{ experience_url }}</span>
        <button class="btn btn-primary btn-copy" id="btn-copy">
          <span id="copy-text">Copy Link</span>
        </button>
      </div>

      <div style="display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap;">
        <a href="/h/{{ share_code }}" class="btn btn-primary" id="btn-preview">
          Open Experience
        </a>
        <a href="/create" class="btn btn-secondary">
          Create Another
        </a>
      </div>
    </div>
  </main>

  <script>
    const copyBtn = document.getElementById('btn-copy');
    const copyText = document.getElementById('copy-text');
    const shareLink = document.getElementById('share-link').textContent.trim();

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareLink);
        copyText.textContent = "Copied! ✓";
        copyBtn.style.background = "#2a9d8f";
        setTimeout(() => {
          copyText.textContent = "Copy Link";
          copyBtn.style.background = "";
        }, 2200);
      } catch (err) {
        // Fallback for older browsers
        const tempInput = document.createElement("input");
        tempInput.value = shareLink;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        copyText.textContent = "Copied! ✓";
        setTimeout(() => {
          copyText.textContent = "Copy Link";
        }, 2200);
      }
    });
  </script>
</body>
</html>
